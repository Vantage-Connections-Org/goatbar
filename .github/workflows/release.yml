name: release

# Push a tag like v0.1.0 to build both apps and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Self-contained: runs on any Windows 10/11 PC without installing .NET.
      - name: Build GoatBar.exe
        shell: pwsh
        run: |
          dotnet publish src/GoatBar.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out
          New-Item -ItemType Directory out/hooks | Out-Null
          Copy-Item hooks/agent-status.js out/hooks/
          Copy-Item LICENSE out/
          Compress-Archive -Path out/GoatBar.exe, out/hooks, out/LICENSE -DestinationPath GoatBar-windows-x64.zip
          (Get-Item GoatBar-windows-x64.zip).Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GoatBar-windows-x64.zip
          if-no-files-found: error

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build GoatBar.app
        run: bash mac/build-app.sh && cp mac/build/GoatBar-mac.zip GoatBar-mac-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: GoatBar-mac-preview.zip
          if-no-files-found: error

  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # "What's new": this tag's section of CHANGELOG.md (heading "## vX.Y.Z ...").
          awk -v t="$TAG" '$0 ~ "^## "t" " {on=1; next} /^## v/ {on=0} on' CHANGELOG.md > changes.md
          cat > notes.md <<'EOF'
          ## Download

          **Windows 10/11:** `GoatBar-windows-x64.zip`. Unzip anywhere (for example `%LOCALAPPDATA%\GoatBar`) and run `GoatBar.exe`. No .NET install needed. The exe isn't code-signed yet, so Windows SmartScreen may ask you to confirm: click *More info* then *Run anyway*.

          **macOS 13+ (preview):** `GoatBar-mac-preview.zip`. A first build of the menu bar version. It compiles and packages in CI but hasn't been widely tested yet; please [open an issue](https://github.com/Vantage-Connections-Org/goatbar/issues) with what you see. Not notarized: macOS blocks it on first launch. Open System Settings > Privacy & Security, scroll to Security, and click *Open Anyway*.

          Optional live-step hook: see the README.
          EOF
          if [ -s changes.md ]; then { echo "## What's new"; cat changes.md; echo; cat notes.md; } > n2.md && mv n2.md notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" GoatBar-windows-x64.zip GoatBar-mac-preview.zip --clobber
          else
            gh release create "$TAG" GoatBar-windows-x64.zip GoatBar-mac-preview.zip --title "GoatBar $TAG" --notes-file notes.md
          fi
